<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f6f6fb"><title>Live Direct · 直播控制台</title><link rel="icon" href="/static/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/static/icon-180.png"><link rel="stylesheet" href="/static/style.css"><script defer src="/static/qrcode.min.js"></script><script defer src="/static/admin.js"></script></head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></symbol>
<symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8M10 12h10m-3.5-3.5L20 12l-3.5 3.5"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 3 19.5h18zM12 10v4.5M12 17.2v.3"/></symbol>
<symbol id="i-qr" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2.5v2.5H14zM17.5 17.5H20V20h-2.5zM14 20h1M20 14v1"/></symbol>
<symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12.5" rx="2"/><path d="m8.5 2.5 3.5 3.5 3.5-3.5M9 21h6"/></symbol>
</svg>
<a class="skip-link" href="#main">跳至主要内容</a>
<div class="app">
<aside class="sidebar">
  <a class="brand" href="/admin"><img src="/static/icon.svg" alt="" width="36" height="36"><span><b>Live Direct</b><small>直播源控制台</small></span></a>
  <nav id="nav" class="nav" aria-label="控制台导航"></nav>
  <div class="sidebar-foot">
    <button id="copy-subscription" class="btn btn-primary btn-block" type="button" disabled><svg class="icon"><use href="#i-link"/></svg>复制订阅地址</button>
    <button id="logout" class="btn btn-ghost btn-block" type="button"><svg class="icon"><use href="#i-logout"/></svg>退出登录</button>
  </div>
</aside>
<main id="main" class="main" tabindex="-1">
  <p id="open-warning" class="banner banner-danger" hidden><svg class="icon"><use href="#i-alert"/></svg><span>当前后台免登录：所有能访问本服务的人都能修改配置并获取订阅。仅限可信内网/VPN，禁止直接开放公网。</span></p>
  <header class="page-head">
    <div class="page-title"><span id="page-badge" class="platform-badge" hidden></span><div><h1 id="page-title">总览</h1><p id="page-description" class="muted"></p></div></div>
    <div class="head-actions"><span id="last-refresh" class="muted small"></span><button id="refresh" class="btn" type="button" disabled><svg class="icon"><use href="#i-refresh"/></svg><span>刷新频道</span></button></div>
  </header>

  <section id="overview-view" class="view" hidden>
    <div class="stats">
      <div class="stat"><span class="muted">当前频道</span><strong id="stat-channels">—</strong></div>
      <div class="stat"><span class="muted">已启用平台</span><strong id="stat-enabled">—</strong></div>
      <div class="stat"><span class="muted">上次刷新</span><strong id="stat-updated">—</strong></div>
    </div>
    <div id="platform-cards" class="platform-cards"></div>
    <section class="card howto">
      <div class="howto-icon"><svg class="icon"><use href="#i-tv"/></svg></div>
      <div><h2>在播放器中使用</h2><p class="muted">点击左侧「复制订阅地址」，粘贴到 APTV 等支持 M3U 的播放器。频道播放时实时解析并直连平台 CDN，本服务不转发视频。订阅地址包含私有令牌，请勿公开分享。</p></div>
      <button id="copy-subscription-2" class="btn" type="button" disabled><svg class="icon"><use href="#i-link"/></svg>复制订阅地址</button>
    </section>
  </section>

  <form id="config-form" class="view" hidden novalidate>
    <div id="config-body" class="config-body"></div>
    <div id="save-bar" class="save-bar" hidden><span><b>有未保存的更改</b><span class="muted">保存后会自动刷新本平台频道</span></span><span class="save-actions"><button id="discard" class="btn btn-ghost" type="button">撤销</button><button id="save" class="btn btn-primary" type="submit">保存配置</button></span></div>
  </form>

  <section class="card channels" aria-labelledby="channels-heading">
    <div class="channels-head">
      <div><h2 id="channels-heading">全部频道</h2><p id="channels-summary" class="muted small">仅展示元数据，不显示播放直链</p></div>
      <label class="search"><svg class="icon"><use href="#i-search"/></svg><input id="channel-search" type="search" placeholder="搜索主播、标题或房间号" aria-label="搜索频道"></label>
    </div>
    <div id="channel-filters" class="filters" role="group" aria-label="按平台筛选"></div>
    <div id="channel-list" class="channel-list"></div>
  </section>
  <footer class="footer">Live Direct · 独立运行，不依赖其他 IPTV 服务 · 请仅使用有权访问的内容</footer>
</main>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body></html>
