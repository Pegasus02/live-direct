name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline regression tests
        run: python -B -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check live_direct/web/admin.js
  scripting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript
        run: npm install --no-save --prefix "$RUNNER_TEMP/ts" typescript@5
      - name: Strict type check of the ported core
        run: '"$RUNNER_TEMP/ts/node_modules/.bin/tsc" --noEmit --strict --target ES2020 --lib ES2021,DOM scripting/live-direct/core/*.ts'
      - name: TypeScript port matches the Python backend
        env:
          NODE_PATH: ${{ runner.temp }}/ts/node_modules
        run: |
          python3 scripting/tests/gen_cases.py > "$RUNNER_TEMP/cases.json"
          node scripting/tests/run.mjs "$RUNNER_TEMP/cases.json"
          node scripting/tests/backend.test.mjs
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container without platform credentials
        run: docker build -t live-direct:test .
      - name: Non-root readonly startup and persistence smoke test
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'docker stop live-direct-ci >/dev/null 2>&1 || true' EXIT
          mkdir "$work/data"
          sudo chown 10001:10001 "$work/data"
          sudo chmod 700 "$work/data"
          docker run -d --name live-direct-ci --read-only --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:1907:8080 -v "$work/data:/data" -e ADMIN_TOKEN=ci-dummy-admin-not-a-real-secret-123456 -e SUBSCRIPTION_TOKEN=ci-dummy-sub-not-a-real-secret-123456 -e PUBLIC_BASE=http://127.0.0.1:1907 live-direct:test
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:1907/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:1907/health
          test "$(docker inspect -f '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}}' live-direct-ci)" = '10001:10001 true'
          docker exec live-direct-ci python3 -c "from pathlib import Path; from live_direct.config import ConfigStore; p=Path('/data/config.json'); s=ConfigStore(p); s.update({'douyin':{'count':2}}); assert ConfigStore(p).get()['douyin']['count']==2; assert p.stat().st_mode & 0o777 == 0o600"
          docker restart live-direct-ci
          docker exec live-direct-ci python3 -c "from pathlib import Path; from live_direct.config import ConfigStore; assert ConfigStore(Path('/data/config.json')).get()['douyin']['count']==2"
